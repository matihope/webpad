<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <title>webpad</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body class="landing">
  <main>
    <img src="icon.svg" alt="" width="72" height="72">
    <h1>webpad</h1>
    <p class="lede">Use your phone as a game controller.</p>

    <form id="join">
      <label class="field">
        <span>Your name (optional)</span>
        <input id="name" type="text" maxlength="24" autocomplete="nickname" placeholder="Player">
      </label>
      <label id="code-field" class="field" hidden>
        <span>Join code</span>
        <input id="code" type="text" autocomplete="off" autocapitalize="off" required>
      </label>
      <button type="submit" class="primary big">Join as player</button>
    </form>

    <a class="manage" href="/admin">Manage players <span id="lock" hidden>🔒</span></a>
  </main>

  <script src="common.js"></script>
  <script>
    'use strict';
    const $ = (sel) => document.querySelector(sel);
    $('#name').value = store.get(NAME_KEY);
    $('#code').value = store.get(CODE_KEY);

    fetch('/api/info').then((r) => r.json()).then((info) => {
      $('#code-field').hidden = !info.codeRequired;
      $('#code').required = info.codeRequired;
      $('#lock').hidden = !info.adminPasswordRequired || info.admin;
    }).catch(() => {});

    $('#join').addEventListener('submit', (e) => {
      e.preventDefault();
      store.set(NAME_KEY, $('#name').value.trim());
      if (!$('#code-field').hidden) store.set(CODE_KEY, $('#code').value.trim());
      location.href = '/pad';
    });
  </script>
</body>
</html>
